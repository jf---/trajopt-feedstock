schema_version: 1

context:
  # dev track: upstream main at a pinned SHA. `.dev<commit date>` sorts below the
  # next release (0.36.0.dev20260930 < 0.36.0), so the 0.36.0 package supersedes it.
  version: "0.36.0.dev20261013"
  upstream_sha: "a504b2208d43ca0e4e80e39f6c1712eacb4a6772"
  # C++ only, built here: conda-forge piqp carries a Python pin and ships no DLL on win-64.
  piqp_version: "0.6.4"

package:
  name: trajopt
  version: ${{ version }}

source:
  - url: https://github.com/tesseract-robotics/trajopt/archive/${{ upstream_sha }}.tar.gz
    sha256: 33a3a27b679d36bb889b038b195b5bd5dc4ae82a3cf036a66941de2037d9e941
    file_name: source.tar.gz
    # Not extracted by rattler-build (see build.sh / build.bat: the tarball's `ci` symlink is skipped on Windows),
    # so `patches:` cannot apply here. The build scripts apply patches/*.patch to src/ in order after extracting:
    #   0001-0004: tesseract-robotics/trajopt#606, #617, #626 (fix/ifopt-declared-members), until merged upstream.
  - url: https://github.com/PREDICT-EPFL/piqp/archive/refs/tags/v${{ piqp_version }}.tar.gz
    sha256: 8a6381e65ac8626f804c98453966aed064bced0f6a0fc1ebc9010604fae3d676
    file_name: piqp.tar.gz

build:
  number: 2

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - gtest
    - gmock
    - cmake
    - ninja
    - ros-industrial-cmake-boilerplate
    - if: unix
      then: patch
    - if: win
      then: m2-patch
    - benchmark
    - lcov
  host:
    - libboost-devel
    - cereal
    - eigen-abi-devel
    - tinyxml2
    - spdlog
    - assimp
    - urdfdom
    - fcl
    - octomap 
    - orocos-kdl 
    - pcl
    - gtest
    - gmock
    - pkg-config 
    - xz
    - flann
    - jsoncpp
    - yaml-cpp
    - bullet-cpp
    - blas
    - osqp
    - osqp-eigen
    - qpoases
    - tesseract-robotics
    - if: unix
      then:
        - xorg-libx11
        - xorg-libxext
  run:
    - libboost-devel
    - cereal
    - eigen
    - tinyxml2
    - spdlog
    - assimp
    - urdfdom
    - fcl
    - octomap 
    - orocos-kdl 
    - pcl
    - gtest
    - gmock
    - xz
    - jsoncpp
    - taskflow 
    - yaml-cpp
    - bullet-cpp
    - blas
    - osqp
    - osqp-eigen
    - qpoases
    - if: unix
      then:
        - xorg-libx11
        - xorg-libxext
  run_exports:
    - ${{ pin_subpackage('trajopt', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - trajopt/fwd.hpp
        - trajopt_common/fwd.h
        - trajopt_ifopt/fwd.h
        - trajopt_sco/sco_common.hpp
        - trajopt_sqp/fwd.h
        - trajopt_sqp/piqp_solver.h
        - piqp/piqp.hpp
      lib:
        - trajopt
        - trajopt_common
        - trajopt_ifopt
        - trajopt_sco
        - trajopt_sqp

about:
  summary: Trajectory Optimization Motion Planner
  license: BSD-2-Clause
  license_file:
    - src/trajopt/LICENSE
    - piqp_src/LICENSE
  homepage: https://github.com/tesseract-robotics/trajopt

extra:
  recipe-maintainers:
    - johnwason
    - Levi-Armstrong
    - traversaro

