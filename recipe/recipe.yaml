schema_version: 1

context:
  # dev track: upstream main at a pinned SHA. `.dev<commit date>` sorts below the
  # next release (0.36.0.dev20260930 < 0.36.0), so the 0.36.0 package supersedes it.
  version: "0.36.0.dev20260930"
  upstream_sha: "de9e941b7141012e4054bcdea2e552021a996842"

package:
  name: trajopt
  version: ${{ version }}

source:
  - url: https://github.com/tesseract-robotics/trajopt/archive/${{ upstream_sha }}.tar.gz
    sha256: 0552d555df47abde3f72f94f3cb510ace4b28add236f8f4f20fb63bc481cd661
    file_name: source.tar.gz

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - gtest
    - gmock
    - cmake
    - ninja
    - ros-industrial-cmake-boilerplate
    - benchmark
    - lcov
  host:
    - libboost-devel
    - cereal
    - eigen-abi-devel
    - tinyxml2
    - spdlog
    - assimp
    - urdfdom
    - fcl
    - octomap 
    - orocos-kdl 
    - pcl
    - gtest
    - gmock
    - pkg-config 
    - xz
    - flann
    - jsoncpp
    - yaml-cpp
    - bullet-cpp
    - blas
    - osqp
    - osqp-eigen
    - qpoases
    - tesseract-robotics
    - if: unix
      then:
        - xorg-libx11
        - xorg-libxext
  run:
    - libboost-devel
    - cereal
    - eigen
    - tinyxml2
    - spdlog
    - assimp
    - urdfdom
    - fcl
    - octomap 
    - orocos-kdl 
    - pcl
    - gtest
    - gmock
    - xz
    - jsoncpp
    - taskflow 
    - yaml-cpp
    - bullet-cpp
    - blas
    - osqp
    - osqp-eigen
    - qpoases
    - if: unix
      then:
        - xorg-libx11
        - xorg-libxext
  run_exports:
    - ${{ pin_subpackage('trajopt', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - trajopt/fwd.hpp
        - trajopt_common/fwd.h
        - trajopt_ifopt/fwd.h
        - trajopt_sco/sco_common.hpp
        - trajopt_sqp/fwd.h
      lib:
        - trajopt
        - trajopt_common
        - trajopt_ifopt
        - trajopt_sco
        - trajopt_sqp

about:
  summary: Trajectory Optimization Motion Planner
  license: BSD-2-Clause
  license_file: src/trajopt/LICENSE
  homepage: https://github.com/tesseract-robotics/trajopt

extra:
  recipe-maintainers:
    - johnwason
    - Levi-Armstrong
    - traversaro

